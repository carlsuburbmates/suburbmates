name: Tax Practitioners Board catalogue discovery

on:
  schedule:
    - cron: "17 20 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-tax-practitioners-board
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run acquire:tpb
      - run: npm run audit -- data/vendor-candidates-tax-practitioners-board.csv

      - uses: actions/upload-artifact@v6
        with:
          name: tax-practitioners-board-candidates-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: data/vendor-candidates-tax-practitioners-board.csv

  mark-handoff-running:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Record the organisation-only source refresh as running
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data "{\"source\":\"tax_practitioners_board\",\"outcome\":\"started\",\"workflowRunId\":\"${{ github.run_id }}\"}" \
            https://suburbmates.com.au/api/automation/catalogue-run-status

  handoff:
    needs: [discover, mark-handoff-running]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: tax-practitioners-board-candidates-${{ github.run_id }}
          path: data

      - name: Send organisation-only candidates to the private qualification handoff
        run: npm run candidate:handoff -- data/vendor-candidates-tax-practitioners-board.csv
        env:
          CATALOGUE_SOURCE: tax_practitioners_board
          CANDIDATE_HANDOFF_URL: https://suburbmates.com.au/api/automation/candidates
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}

      - name: Confirm privacy and publication boundary
        run: echo "Only organisation trading-name, business-address and registration-status candidates entered the authenticated handoff. Individual-agent data never enters the CSV, artifact or public directory."

  record-handoff-outcome:
    if: always()
    needs: [discover, mark-handoff-running, handoff]
    runs-on: ubuntu-latest
    steps:
      - name: Record the aggregate source-run outcome
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
          HANDOFF_RESULT: ${{ needs.handoff.result }}
        run: |
          if [ "$HANDOFF_RESULT" = "success" ]; then
            outcome=completed
          else
            outcome=failed
          fi
          # A terminal health callback must outlast a transient Worker edge
          # incident; candidate receipts and listing decisions are idempotent.
          curl --fail-with-body --retry 12 --retry-all-errors --retry-max-time 900 --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data "{\"source\":\"tax_practitioners_board\",\"outcome\":\"$outcome\",\"workflowRunId\":\"${{ github.run_id }}\"}" \
            https://suburbmates.com.au/api/automation/catalogue-run-status
          if [ "$outcome" != "completed" ]; then
            exit 1
          fi
