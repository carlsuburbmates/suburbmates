name: ASIC Credit Licensee catalogue discovery

on:
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-asic-credit-licensees
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run acquire:asic-credit
      - run: npm run audit -- data/vendor-candidates-asic-credit-licensees.csv

      - uses: actions/upload-artifact@v6
        with:
          name: asic-credit-licensee-candidates-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: data/vendor-candidates-asic-credit-licensees.csv

  mark-handoff-running:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Record the organisation-only source refresh as running
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data "{\"source\":\"asic_credit_licensees\",\"outcome\":\"started\",\"workflowRunId\":\"${{ github.run_id }}\"}" \
            https://suburbmates.com.au/api/automation/catalogue-run-status

  handoff:
    needs: [discover, mark-handoff-running]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: asic-credit-licensee-candidates-${{ github.run_id }}
          path: data

      - name: Send organisation-only candidates to the private qualification handoff
        run: npm run candidate:handoff -- data/vendor-candidates-asic-credit-licensees.csv
        env:
          CATALOGUE_SOURCE: asic_credit_licensees
          CANDIDATE_HANDOFF_URL: https://suburbmates.com.au/api/automation/candidates
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}

      - name: Confirm privacy and publication boundary
        run: echo "Only active corporate or institutional credit-licensee names and principal Darebin localities enter the handoff. Individual licensee names, raw licence numbers, ABNs, ACNs, authorisations, coordinates and postal addresses never enter the CSV, artifact or public directory."

  record-handoff-outcome:
    if: always()
    needs: [discover, mark-handoff-running, handoff]
    runs-on: ubuntu-latest
    steps:
      - name: Record the aggregate source-run outcome
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
          HANDOFF_RESULT: ${{ needs.handoff.result }}
        run: |
          if [ "$HANDOFF_RESULT" = "success" ]; then
            outcome=completed
          else
            outcome=failed
          fi
          curl --fail-with-body --retry 3 --retry-all-errors --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data "{\"source\":\"asic_credit_licensees\",\"outcome\":\"$outcome\",\"workflowRunId\":\"${{ github.run_id }}\"}" \
            https://suburbmates.com.au/api/automation/catalogue-run-status
          if [ "$outcome" != "completed" ]; then
            exit 1
          fi
