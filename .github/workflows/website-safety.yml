name: Website safety evidence

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: website-safety-evidence
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect website safety evidence
        env:
          WEBSITE_CHECK_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          WEBSITE_CHECK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SMOKE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run website-safety
      - uses: actions/upload-artifact@v4
        with:
          name: website-safety-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/website-safety-report.json
      - name: Fail when review is needed
        run: node -e 'const report=require("./artifacts/website-safety-report.json"); if (report.flagged) { console.error(`${report.flagged} website check(s) need review.`); process.exit(1); }'
      - name: Open or update one review issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Website safety] Evidence review needed'
          body="Website safety evidence needs review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No listings were changed automatically."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
