name: Website safety evidence

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: website-safety-evidence
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect website safety evidence
        env:
          WEBSITE_CHECK_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          WEBSITE_CHECK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SMOKE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run website-safety
      - uses: actions/upload-artifact@v6
        with:
          name: website-safety-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/website-safety-report.json
      - name: Record evidence summary
        run: |
          node -e 'const report=require("./artifacts/website-safety-report.json"); console.log(`Website evidence retained: ${report.total} checked, ${report.flagged} background exception(s).`);'
