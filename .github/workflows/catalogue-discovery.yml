name: Catalogue candidate discovery

on:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # Small, retried handoff batches prioritise a reliable private record over
    # fast bulk processing. Leave enough time for the full approved-source run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run acquire:osm
      - run: npm run audit -- data/vendor-candidates-osm.csv
      - run: npm run catalogue:merge
      - run: npm run audit -- data/vendor-candidates-merged.csv
      - run: npm run catalogue:report -- data/vendor-candidates-merged.csv

      - uses: actions/upload-artifact@v6
        with:
          name: catalogue-candidates-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data/vendor-candidates-osm.csv
            data/vendor-candidates-merged.csv

      - name: Send approved-source candidates to the private qualification handoff
        run: npm run candidate:handoff -- data/vendor-candidates-osm.csv
        env:
          CANDIDATE_HANDOFF_URL: https://suburbmates.com.au/api/automation/candidates
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}

      - name: Confirm publication boundary
        run: echo "Candidates entered the authenticated qualification handoff. Only a deterministic qualifying result can create an unclaimed listing; exceptions remain private in Ops."
