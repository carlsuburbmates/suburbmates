name: Catalogue candidate discovery

on:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-candidate-discovery
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run acquire:osm
      - run: npm run audit -- data/vendor-candidates-osm.csv
      - run: npm run catalogue:report -- data/vendor-candidates-osm.csv

      - uses: actions/upload-artifact@v6
        with:
          name: catalogue-candidates-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: data/vendor-candidates-osm.csv

      - uses: actions/upload-artifact@v6
        with:
          name: catalogue-osm-handoff-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: data/vendor-candidates-osm.csv

  handoff:
    needs: [acquire, mark-handoff-running]
    runs-on: ubuntu-latest
    # Each bounded source batch retains an idempotent audit path. The public
    # Worker can exceed its resource ceiling when several shards continuously
    # issue database-backed requests at once. Keep one paced lane while the
    # handoff script uses small batches to make the lawful refresh practical.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: catalogue-osm-handoff-${{ github.run_id }}
          path: data

      - name: Send approved-source candidates to the private qualification handoff
        run: npm run candidate:handoff -- data/vendor-candidates-osm.csv --shard-index ${{ matrix.shard_index }} --shard-count 8
        env:
          CANDIDATE_HANDOFF_URL: https://suburbmates.com.au/api/automation/candidates
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}

      - name: Confirm publication boundary
        run: echo "Candidates entered the authenticated qualification handoff. Only a deterministic qualifying result can create an unclaimed listing; exceptions remain private in Ops."

  mark-handoff-running:
    needs: acquire
    runs-on: ubuntu-latest
    steps:
      - name: Record the approved source refresh as running
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data "{\"source\":\"openstreetmap\",\"outcome\":\"started\",\"workflowRunId\":\"${{ github.run_id }}\"}" \
            https://suburbmates.com.au/api/automation/catalogue-run-status

  record-handoff-outcome:
    if: always()
    needs: [acquire, mark-handoff-running, handoff]
    runs-on: ubuntu-latest
    steps:
      - name: Record the aggregate source-run outcome
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
          HANDOFF_RESULT: ${{ needs.handoff.result }}
        run: |
          if [ "$HANDOFF_RESULT" = "success" ]; then
            outcome=completed
          else
            outcome=failed
          fi
          # The source batches already reached durable, idempotent receipts.
          # Keep retrying a terminal callback through a transient Worker edge
          # incident so a healthy completed run is not left falsely "running".
          curl --fail-with-body --retry 12 --retry-all-errors --retry-max-time 900 --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data "{\"source\":\"openstreetmap\",\"outcome\":\"$outcome\",\"workflowRunId\":\"${{ github.run_id }}\"}" \
            https://suburbmates.com.au/api/automation/catalogue-run-status
          if [ "$outcome" != "completed" ]; then
            exit 1
          fi
