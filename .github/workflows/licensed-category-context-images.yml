name: Licensed category-context images

on:
  schedule:
    - cron: "23 20 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licensed-category-context-images
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh one bounded licensed category-image batch
        env:
          AUTOMATION_INGEST_TOKEN: ${{ secrets.AUTOMATION_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "authorization: Bearer $AUTOMATION_INGEST_TOKEN" \
            --header "content-type: application/json" \
            --data '{}' \
            https://suburbmates.com.au/api/automation/category-context-images
